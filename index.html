<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영토 · 국가 건설 전쟁 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 시작 화면 -->
  <div id="start-screen">
    <div class="start-card">
      <div class="eyebrow">NATION // BLUEPRINT</div>
      <h1>국가를 설계하라</h1>
      <p>격자 필드 위에 수도를 세우고, 자원을 채굴하며, 다른 국가와 맞서 싸우세요.</p>
      <label>국가 이름
        <input id="nation-name" type="text" placeholder="예: 철기 공화국" maxlength="16" />
      </label>
      <label>국기 색상
        <input id="nation-color" type="color" value="#d98e34" />
      </label>
      <button id="start-btn">다음: 수도 위치 선택</button>
      <p class="hint">다음 화면에서 지도를 움직여 수도를 세울 위치를 직접 골라주세요.</p>
    </div>
  </div>

  <!-- 메인 게임 화면 -->
  <div id="app">
    <header id="topbar">
      <div class="brand">NATION<span>BLUEPRINT</span></div>
      <div id="resource-bar" class="resource-bar"></div>
      <div id="mp-status" class="mp-status">⚪ 연결 대기중</div>
    </header>

    <main id="layout">
      <aside id="left-panel">
        <h2>건설 카탈로그</h2>
        <div id="cost-preview" class="cost-preview">구조물을 선택하세요</div>
        <div id="build-menu" class="build-menu"></div>
      </aside>

      <section id="field-wrap">
        <canvas id="field"></canvas>
        <div id="flash" class="flash"></div>

        <!-- 수도 위치 선택 오버레이 (지도가 보이는 상태에서 탭으로 위치 지정) -->
        <div id="placement-bar" class="placement-bar hidden">
          <span id="placement-text">지도를 움직여 수도를 세울 칸을 탭하세요</span>
          <button id="placement-confirm" disabled>이 위치에 수도 건설</button>
        </div>

        <!-- 터치 전용 툴바: 키보드 없이도 회전/전력범위/줌 조작 -->
        <div id="touch-toolbar" class="touch-toolbar hidden">
          <button id="rotate-btn" class="toolbar-btn" title="벨트 방향 회전" disabled>⟳ 회전</button>
          <button id="power-btn" class="toolbar-btn" title="전력 공급 범위 표시">⚡ 전력범위</button>
          <button id="zoom-in-btn" class="toolbar-btn" title="확대">＋</button>
          <button id="zoom-out-btn" class="toolbar-btn" title="축소">－</button>
        </div>
      </section>

      <aside id="right-panel">
        <div id="struct-panel" class="panel-box">
          <div class="ph">타일 정보</div>
          <div class="pd">필드를 클릭해 정보를 확인하세요.</div>
        </div>

        <div class="panel-box">
          <div class="ph">전쟁</div>
          <div id="war-list" class="war-list"><div class="pd">국가를 발견하면 표시됩니다.</div></div>
        </div>

        <div class="panel-box">
          <div class="ph">전투 기록</div>
          <div id="battle-log" class="battle-log"></div>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
